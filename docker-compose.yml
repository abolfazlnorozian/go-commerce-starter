version: '3.8'
services:
  app:
    build: .
    container_name: robin-app
    ports:
      - ${PORT}:${PORT}
    # Loads all keys from local .env (gitignored), including SMS pattern codes
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - MONGO_URL=${MONGO_URL}
      - DBNAME=${DBNAME}
      - CORS_DOMAIN=${CORS_DOMAIN}
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID}
      - IPPANEL_API_KEY=${IPPANEL_API_KEY}
      - IPPANEL_ORIGINATOR=${IPPANEL_ORIGINATOR}
      - IPPANEL_SMS_SENDER=${IPPANEL_SMS_SENDER}
      - IPPANEL_PATTERN_VERIFY=${IPPANEL_PATTERN_VERIFY}
      - IPPANEL_PATTERN_PAYMENT=${IPPANEL_PATTERN_PAYMENT}
      - IPPANEL_PATTERN_READY_PRODUCT=${IPPANEL_PATTERN_READY_PRODUCT}
      - IPPANEL_PATTERN_SEND_PRODUCT=${IPPANEL_PATTERN_SEND_PRODUCT}
      - IPPANEL_PATTERN_ADMIN=${IPPANEL_PATTERN_ADMIN}
      - ADMINS_PHONES=${ADMINS_PHONES}
      - MIGRATION_DELETE_CART=${MIGRATION_DELETE_CART}
      - IMAGE_QUALITY=${IMAGE_QUALITY}
    depends_on:
      - mongo
    volumes:
      - ./public/images:/app/public/images
      # So godotenv.Load(".env") inside the app can read the same local file
      - ./.env:/app/.env:ro

  mongo:
    image: mongo:4.4.18
    container_name: robin-mongo
    ports:
      - 27018:27017
    volumes:
      - robin-mongo:/data/db

volumes:
  robin-mongo:
